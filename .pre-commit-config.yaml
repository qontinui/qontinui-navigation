repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-dts-freshness
        name: Check dist/index.d.ts is fresh relative to src/
        entry: .pre-commit-hooks/check-dts-freshness.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

ci:
  autofix_prs: true
  autofix_commit_msg: "chore: pre-commit auto fixes"
